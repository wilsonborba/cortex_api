[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "0.1.3"
description = "Multi-model AI orchestration system: dynamic effort tiers, quota tracking, and evidence-based routing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "rich>=13.7,<14",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
  "websockets>=13,<15",
  "duckduckgo-search>=6.2,<8",
  "trafilatura>=1.12,<3",
  "cssselect>=1.2,<2",
  "PyMuPDF>=1.24,<2",
  "pillow>=10,<12",
  "pytesseract>=0.3,<1",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
crawler = [
  "crawl4ai>=0.4,<1",
]
media = [
  "faster-whisper>=1.2,<2",
  "nvidia-cublas-cu12>=12.4,<13",
  "nvidia-cudnn-cu12>=9,<10",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5.0,<7",
]

[project.scripts]
cortex = "lib.entrypoints:cli_entrypoint"
cortex-api = "lib.entrypoints:api_entrypoint"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]
